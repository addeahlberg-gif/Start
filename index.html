<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0f0d"><title>Startportal</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="brand"><b>S</b><span><strong>Startportal</strong><small>Andreas arbetsyta</small></span></div><form id="searchForm"><input id="search" placeholder="Sök bland länkar eller tryck Enter för webbsökning"></form><button id="reset" title="Återställ">↺</button></header>
<div class="layout"><aside>
<section class="panel"><div class="panelhead"><div><p class="tag">NASDAQ STOCKHOLM</p><h2>Börsindex</h2></div><button id="refreshMarket">↻</button></div><div id="markets"></div><p class="muted" id="marketTime"></p></section>
<section class="panel weather"><div class="panelhead"><h2>Väder</h2><button id="changePlace">Byt ort</button></div><div id="weather">Laddar...</div></section>
<section class="panel"><h2>Säkerhetskopia</h2><div class="row"><button id="export">Exportera</button><label class="button" for="import">Importera</label><input hidden id="import" type="file" accept="application/json"></div></section>
</aside><main><div class="welcome"><div><p class="tag" id="todayLabel"></p><h1 id="greeting"></h1></div><div class="row"><button id="editMode">Redigera länkar</button><button id="addCategory">+ Kategori</button><button class="primary" id="addLink">+ Länk</button></div></div><div id="categories" class="category-grid"></div><section class="panel"><div class="panelhead"><h2>RSS-flöden</h2><button id="manageFeeds">Hantera</button></div><div id="feedTabs" class="tabs"></div><div id="feedList" class="feedlist"></div></section></main>
<aside><section class="panel sticky"><div class="panelhead"><h2>Kalender</h2><div class="row"><button id="prev">‹</button><button id="calToday">Idag</button><button id="next">›</button></div></div><h2 id="monthTitle"></h2><div id="calendar" class="calendar"></div><div id="dayInfo" class="dayinfo"></div></section></aside></div>
<dialog id="categoryDialog"><form id="categoryForm"><h2>Kategori</h2><input name="id" type="hidden"><label>Namn<input name="name" required></label><label>Färg<input name="color" type="color" value="#45a86d"></label><div class="row end"><button type="button" data-close>Avbryt</button><button class="primary">Spara</button></div></form></dialog>
<dialog id="linkDialog"><form id="linkForm"><h2>Länk</h2><input name="id" type="hidden"><label>Namn<input name="title" required></label><label>Webbadress<input name="url" type="url" required value="https://"></label><label>Kategori<select name="categoryId"></select></label><div class="row end"><button type="button" data-close>Avbryt</button><button class="primary">Spara</button></div></form></dialog>
<dialog id="feedDialog"><form id="feedForm"><h2>RSS-flöden</h2><label>Namn<input name="name" required></label><label>RSS-adress<input name="url" type="url" required></label><button class="primary">Lägg till</button><div id="feedAdmin"></div><div class="row end"><button type="button" data-close>Stäng</button></div></form></dialog>
<dialog id="placeDialog"><form id="placeForm"><h2>Välj väderort</h2><label>Ort<input name="place" required></label><div class="row end"><button type="button" data-close>Avbryt</button><button class="primary">Hämta</button></div></form></dialog>
<dialog id="confirmDialog"><form method="dialog"><h2>Bekräfta</h2><p id="confirmText"></p><div class="row end"><button value="cancel">Avbryt</button><button class="danger" value="yes">Ta bort</button></div></form></dialog><div id="toast"></div><script src="app.js"></script></body></html>
